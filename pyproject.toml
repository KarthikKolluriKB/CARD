[project]
name = "card-model"
version = "1.0.0"
description = "CARD: Cross-component Audio Representation Distillation for Encoder-Free Audio Captioning"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
dependencies = [
    "aac-metrics==0.5.4",
    "accelerate==1.10.0",
    "datasets==3.6.0",
    "huggingface-hub[hf-xet]==0.33.2",
    "numpy==2.2.6",
    "peft==0.18.1",
    "python-dotenv>=1.1.1",
    "pyyaml==6.0.2",
    "soundfile==0.13.1",
    "torch==2.7.1",
    "torchaudio==2.7.1",
    "tqdm>=4.67.1",
    "transformers==4.53.1",
    "wandb==0.23.1",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["card_model"]

[tool.uv.sources]
torch = [
  { index = "pytorch-cu126", marker = "sys_platform != 'linux'" },
]
torchaudio = [
  { index = "pytorch-cu126", marker = "sys_platform != 'linux'" },
]

[[tool.uv.index]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
explicit = true

[tool.pytest.ini_options]
testpaths = ["tests"]
